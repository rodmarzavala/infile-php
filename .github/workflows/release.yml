name: Crear Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Crear Release en GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extraer versión del tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extraer notas del CHANGELOG
        id: changelog
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          # Extrae la sección del CHANGELOG para esta versión
          NOTES=$(awk "/^## \[${VERSION#v}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build WordPress Plugin
        run: |
          cd packages/wordpress
          composer config repositories.core '{"type": "path", "url": "../core", "options": {"symlink": false}}'
          composer update --no-dev --optimize-autoloader --prefer-dist --no-progress
          cd ../..
          # Remove composer.json modifications and lock file to keep it clean if needed, 
          # but we're in CI so it doesn't matter much.
          zip -r infile-php-wordpress.zip packages/wordpress/ -x "packages/wordpress/.git/*" "packages/wordpress/tests/*" "packages/wordpress/composer.json" "packages/wordpress/composer.lock" "packages/wordpress/phpunit.xml" "packages/wordpress/vendor/bin/*"

      - name: Crear release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: "infile-php ${{ steps.tag.outputs.version }}"
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false
          files: |
            infile-php-wordpress.zip
